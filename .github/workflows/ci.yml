# CI de opsRUN: lint, typecheck, Vitest, pgTAP (`supabase test db`) y Playwright.
# La app se conecta directo a Postgres como opsrun_app (ADR 0003).
# Todo corre contra el Supabase local de la CLI, con datos inventados.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, typecheck y Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  base:
    name: pgTAP (supabase test db)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Solo Postgres. La CLI no aplica migraciones (supabase/config.toml).
      - run: pnpm exec supabase db start
      # Imita el alta de opsRUN en Bzzz, aplica las migraciones como
      # opsrun_migrador y corre todo supabase/tests/**/*.sql.
      - run: pnpm test:db

  e2e:
    name: Playwright y pool contra Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Como en la caja: Postgres y GoTrue (Kong lo publica en /auth/v1).
      # opsRUN no usa PostgREST.
      - run: >-
          pnpm exec supabase start
          -x postgrest,realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # Alta local y migraciones como opsrun_migrador, como en la caja.
      - run: pnpm db:prepare
      # Con la base lista, Vitest corre también las pruebas del pool contra
      # Postgres como opsrun_app (src/lib/db/pool.test.ts). Si la base no
      # respondiera, fallan en vez de saltarse.
      - run: pnpm test
        env:
          OPSRUN_REQUIERE_BASE: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
